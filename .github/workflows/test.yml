name: CI - Build & Lint

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

jobs:
  build:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: TypeScript check
        run: npx tsc -b

      - name: Build production
        run: npx vite build

      - name: Verificar que dist/index.html existe
        run: |
          if [ ! -f dist/index.html ]; then
            echo "ERROR: Build no genero dist/index.html"
            exit 1
          fi

      - name: Resumen
        if: success()
        run: echo "Build exitoso. Listo para merge."
