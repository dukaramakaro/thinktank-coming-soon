<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="ThinkTank Creations - Think Wise, Create Smart. Web Development, Process Automation, Audiovisual Production, and Data Solutions.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --neon-purple: #BC13FE;
            --neon-purple-light: #D946EF;
            --bg-dark: #030306;
            --text-white: #ffffff;
            --text-gray: #a0a0a0;
            --glow-color: rgba(188, 19, 254, 0.5);
        }
        body {
            min-height: 100vh;
            background: var(--bg-dark);
            font-family: 'Rajdhani', sans-serif;
            color: var(--text-white);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            perspective: 1000px;
        }

        /* Canvas para partículas */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .circuit-bg {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0; opacity: 0.15; overflow: hidden;
            transition: transform 0.2s ease-out;
        }
        .circuit-bg svg { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        
        /* Pulso nos círculos do circuito */
        .circuit-bg circle {
            animation: nodePulse 3s ease-in-out infinite;
            filter: drop-shadow(0 0 5px var(--neon-purple));
        }
        @keyframes nodePulse {
            0%, 100% { r: 4; opacity: 0.5; }
            50% { r: 6; opacity: 1; }
        }

        .circuit-lines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        .circuit-line {
            position: absolute;
            background: linear-gradient(90deg, transparent, var(--neon-purple), transparent);
            height: 1px; animation: circuitFlow 8s linear infinite; opacity: 0.3;
        }
        .circuit-line:nth-child(1) { top: 20%; width: 30%; left: -30%; animation-delay: 0s; }
        .circuit-line:nth-child(2) { top: 40%; width: 25%; left: -25%; animation-delay: 2s; }
        .circuit-line:nth-child(3) { top: 60%; width: 35%; left: -35%; animation-delay: 4s; }
        .circuit-line:nth-child(4) { top: 80%; width: 20%; left: -20%; animation-delay: 6s; }
        @keyframes circuitFlow { 0% { transform: translateX(0); } 100% { transform: translateX(calc(100vw + 100%)); } }
        
        .glow-orb { position: fixed; border-radius: 50%; filter: blur(80px); z-index: 0; animation: orbFloat 15s ease-in-out infinite; }
        .glow-orb-1 { width: 500px; height: 500px; background: rgba(188, 19, 254, 0.12); top: -150px; right: -150px; }
        .glow-orb-2 { width: 400px; height: 400px; background: rgba(147, 51, 234, 0.08); bottom: -100px; left: -100px; animation-delay: -7s; }
        @keyframes orbFloat { 
            0%, 100% { transform: translate(0, 0) scale(1); } 
            33% { transform: translate(50px, 30px) scale(1.1); }
            66% { transform: translate(-30px, 50px) scale(0.9); }
        }
        
        .container { 
            position: relative; 
            z-index: 10; 
            text-align: center; 
            max-width: 800px; 
            width: 100%;
            transform-style: preserve-3d;
        }
        
        .logo-container { 
            margin-bottom: 1.5rem; 
            animation: fadeInDown 1.2s cubic-bezier(0.2, 0.8, 0.2, 1); 
            transform-style: preserve-3d;
        }
        .logo {
            max-width: 250px; width: 100%; height: auto;
            filter: drop-shadow(0 0 30px rgba(188, 19, 254, 0.4));
            animation: logoPulse 4s ease-in-out infinite;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes logoPulse { 
            0%, 100% { filter: drop-shadow(0 0 30px rgba(188, 19, 254, 0.4)); transform: scale(1); } 
            50% { filter: drop-shadow(0 0 50px rgba(188, 19, 254, 0.7)); transform: scale(1.05); } 
        }
        @keyframes fadeInDown { 0% { opacity: 0; transform: translateY(-50px) translateZ(-100px); } 100% { opacity: 1; transform: translateY(0) translateZ(0); } }
        
        .brand-name {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.8rem, 6vw, 3.2rem);
            font-weight: 700; letter-spacing: 0.1em; margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--text-white) 0%, var(--neon-purple-light) 50%, var(--neon-purple) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            animation: fadeInUp 1s ease-out 0.3s both;
            position: relative;
        }

        /* Glitch Effect */
        .brand-name::before, .brand-name::after {
            content: "ThinkTank Creations";
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-dark);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            opacity: 0;
        }
        .brand-name:hover::before {
            opacity: 0.5; color: #ff00ff; z-index: -1;
            animation: glitch 0.3s cubic-bezier(.25, .46, .45, .94) both infinite;
        }
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-3px, 3px); }
            40% { transform: translate(-3px, -3px); }
            60% { transform: translate(3px, 3px); }
            80% { transform: translate(3px, -3px); }
            100% { transform: translate(0); }
        }

        .tagline {
            font-size: clamp(1rem, 3vw, 1.4rem); font-weight: 400;
            letter-spacing: 0.3em; color: var(--text-gray); margin-bottom: 2.5rem;
            animation: fadeInUp 1s ease-out 0.5s both;
            min-height: 1.5em;
        }
        .tagline span { color: var(--neon-purple-light); text-shadow: 0 0 10px var(--neon-purple); }
        @keyframes fadeInUp { 0% { opacity: 0; transform: translateY(30px); } 100% { opacity: 1; transform: translateY(0); } }
        
        .loading-container { display: flex; flex-direction: column; align-items: center; gap: 1.5rem; animation: fadeInUp 1s ease-out 0.7s both; }
        .loading-text {
            font-family: 'Orbitron', sans-serif; font-size: 0.9rem;
            letter-spacing: 0.3em; color: var(--neon-purple);
            display: flex; align-items: center; gap: 0.5rem;
            text-shadow: 0 0 10px var(--neon-purple);
        }
        .loading-dots { display: flex; gap: 8px; }
        .loading-dots span {
            width: 10px; height: 10px; background: var(--neon-purple); border-radius: 50%;
            animation: dotPulse 1.5s ease-in-out infinite;
            box-shadow: 0 0 10px var(--neon-purple), 0 0 20px var(--neon-purple);
        }
        .loading-dots span:nth-child(1) { animation-delay: 0s; }
        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dotPulse { 0%, 100% { opacity: 0.3; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.3); } }
        
        .services-preview {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.2rem;
            margin-top: 2.5rem; max-width: 550px; margin-left: auto; margin-right: auto;
            animation: fadeInUp 1s ease-out 0.9s both;
            perspective: 1000px;
        }
        .service-tag {
            font-size: 0.85rem; font-weight: 600; letter-spacing: 0.1em;
            padding: 1rem; border: 1px solid rgba(188, 19, 254, 0.2);
            border-radius: 4px; color: var(--text-gray); 
            background: rgba(188, 19, 254, 0.03);
            backdrop-filter: blur(5px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            text-align: center;
            position: relative;
            overflow: hidden;
            cursor: default;
        }
        .service-tag::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(188, 19, 254, 0.2), transparent);
            transition: 0.5s;
        }
        .service-tag:hover { 
            border-color: var(--neon-purple); 
            color: var(--text-white); 
            background: rgba(188, 19, 254, 0.15); 
            box-shadow: 0 0 25px rgba(188, 19, 254, 0.3);
            transform: translateY(-5px) scale(1.05) rotateX(10deg);
        }
        .service-tag:hover::before { left: 100%; }
        
        .contact-section {
            margin-top: 3.5rem;
            display: flex; flex-direction: column; align-items: center; gap: 1.5rem;
            animation: fadeInUp 1s ease-out 1.1s both;
        }
        .email-link {
            font-size: 1rem; letter-spacing: 0.1em; color: var(--neon-purple);
            text-decoration: none; transition: all 0.3s ease;
            display: flex; align-items: center; gap: 0.8rem;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            background: rgba(188, 19, 254, 0.05);
        }
        .email-link:hover { 
            color: var(--neon-purple-light); 
            filter: drop-shadow(0 0 12px var(--neon-purple));
            background: rgba(188, 19, 254, 0.1);
            transform: scale(1.05);
        }
        .email-link svg { width: 20px; height: 20px; fill: currentColor; }
        
        .social-links { display: flex; gap: 2rem; }
        .social-links a {
            color: var(--neon-purple); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; align-items: center; justify-content: center;
            width: 45px; height: 45px;
            border-radius: 50%;
            border: 1px solid rgba(188, 19, 254, 0.2);
            background: rgba(188, 19, 254, 0.05);
        }
        .social-links a:hover { 
            color: var(--text-white); 
            background: var(--neon-purple);
            filter: drop-shadow(0 0 15px var(--neon-purple)); 
            transform: scale(1.2) rotate(360deg);
            border-color: var(--neon-purple-light);
        }
        .social-links svg { width: 22px; height: 22px; fill: currentColor; }
        
        .scanline {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, transparent 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px; pointer-events: none; z-index: 100; opacity: 0.03;
        }
        
        @media (max-width: 600px) {
            body { overflow-y: auto; padding: 1rem; }
            .logo { max-width: 180px; }
            .tagline { letter-spacing: 0.15em; margin-bottom: 1.5rem; }
            .services-preview { grid-template-columns: 1fr; gap: 0.8rem; max-width: 280px; }
            .service-tag { font-size: 0.8rem; padding: 0.8rem; }
            .contact-section { margin-top: 2rem; }
        }
    </style>

    <script>
        // Sistema de Partículas
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.init();
            }

            init() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                this.speedX = Math.random() * 1 - 0.5;
                this.speedY = Math.random() * 1 - 0.5;
                this.opacity = Math.random() * 0.5 + 0.2;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }

            draw() {
                ctx.fillStyle = `rgba(188, 19, 254, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                
                // Brilho
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#BC13FE';
            }
        }

        for (let i = 0; i < 60; i++) {
            particles.push(new Particle());
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // Efeito de Parallax e Interação com Mouse
        const logo = document.getElementById('main-logo');
        const container = document.getElementById('main-container');
        const circuit = document.getElementById('circuit-bg');

        document.addEventListener('mousemove', (e) => {
            const { clientX, clientY } = e;
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            
            // Movimento do container (Tilt 3D)
            const moveX = (clientX - centerX) / 50;
            const moveY = (clientY - centerY) / 50;
            container.style.transform = `rotateY(${moveX}deg) rotateX(${-moveY}deg)`;

            // Movimento do fundo (Parallax)
            const bgX = (clientX - centerX) / 100;
            const bgY = (clientY - centerY) / 100;
            circuit.style.transform = `translate(${bgX}px, ${bgY}px)`;

            // Efeito no logo
            const rect = logo.getBoundingClientRect();
            const logoCenterX = rect.left + rect.width / 2;
            const logoCenterY = rect.top + rect.height / 2;
            const deltaX = clientX - logoCenterX;
            const deltaY = clientY - logoCenterY;
            const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
            const maxDistance = 400;
            let scale = 1.15 - (distance / maxDistance) * 0.15;
            scale = Math.max(1, Math.min(1.15, scale));
            logo.style.transform = `scale(${scale}) translateZ(50px)`;
        });

        document.addEventListener('mouseleave', () => {
            container.style.transform = 'rotateY(0) rotateX(0)';
            logo.style.transform = 'scale(1) translateZ(0)';
            circuit.style.transform = 'translate(0, 0)';
        });

        // Efeito de Digitação no Tagline
        const tagline = document.getElementById('typing-tagline');
        const originalHTML = tagline.innerHTML;
        const text = "THINK WISE, CREATE SMART";
        tagline.innerHTML = "";
        
        let charIndex = 0;
        function typeEffect() {
            if (charIndex < text.length) {
                if (text.substring(charIndex, charIndex + 4) === "WISE") {
                    tagline.innerHTML += '<span style="color: var(--neon-purple-light); text-shadow: 0 0 10px var(--neon-purple);">WISE</span>';
                    charIndex += 4;
                } else if (text.substring(charIndex, charIndex + 5) === "SMART") {
                    tagline.innerHTML += '<span style="color: var(--neon-purple-light); text-shadow: 0 0 10px var(--neon-purple);">SMART</span>';
                    charIndex += 5;
                } else {
                    tagline.innerHTML += text[charIndex];
                    charIndex++;
                }
                setTimeout(typeEffect, 100);
            }
        }
        
        // Iniciar digitação após um pequeno delay
        setTimeout(typeEffect, 1500);

        // Glitch aleatório no nome da marca
        const brandName = document.getElementById('brand-name');
        setInterval(() => {
            if (Math.random() > 0.95) {
                brandName.style.animation = 'glitch 0.2s infinite';
                setTimeout(() => brandName.style.animation = 'fadeInUp 1s ease-out 0.3s both', 200);
            }
        }, 2000);
    </script>
</body>
</html>
