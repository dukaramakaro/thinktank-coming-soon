<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThinkTank Creations | Coming Soon</title>
    <meta name="description" content="ThinkTank Creations - Think Wise, Create Smart. Web Development, Process Automation, Audiovisual Production, and Data Solutions.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --neon-purple: #BC13FE;
            --neon-purple-light: #D946EF;
            --bg-dark: #030306;
            --text-white: #ffffff;
            --text-gray: #a0a0a0;
        }
        body {
            min-height: 100vh;
            background: var(--bg-dark);
            font-family: 'Rajdhani', sans-serif;
            color: var(--text-white);
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .circuit-bg {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0; opacity: 0.15; overflow: hidden;
        }
        .circuit-bg svg { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        .circuit-lines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        .circuit-line {
            position: absolute;
            background: linear-gradient(90deg, transparent, var(--neon-purple), transparent);
            height: 1px; animation: circuitFlow 8s linear infinite; opacity: 0.3;
        }
        .circuit-line:nth-child(1) { top: 20%; width: 30%; left: -30%; animation-delay: 0s; }
        .circuit-line:nth-child(2) { top: 40%; width: 25%; left: -25%; animation-delay: 2s; }
        .circuit-line:nth-child(3) { top: 60%; width: 35%; left: -35%; animation-delay: 4s; }
        .circuit-line:nth-child(4) { top: 80%; width: 20%; left: -20%; animation-delay: 6s; }
        @keyframes circuitFlow { 0% { transform: translateX(0); } 100% { transform: translateX(calc(100vw + 100%)); } }
        .glow-orb { position: fixed; border-radius: 50%; filter: blur(80px); z-index: 0; animation: orbFloat 10s ease-in-out infinite; }
        .glow-orb-1 { width: 400px; height: 400px; background: rgba(188, 19, 254, 0.15); top: -100px; right: -100px; }
        .glow-orb-2 { width: 300px; height: 300px; background: rgba(147, 51, 234, 0.1); bottom: -50px; left: -50px; animation-delay: 5s; }
        @keyframes orbFloat { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(30px, 30px) scale(1.1); } }
        
        .container { position: relative; z-index: 10; text-align: center; max-width: 800px; width: 100%; }
        
        .logo-container { margin-bottom: 1.5rem; animation: fadeInDown 1s ease-out; }
        .logo {
            max-width: 250px; width: 100%; height: auto;
            filter: drop-shadow(0 0 30px rgba(188, 19, 254, 0.5));
            animation: logoPulse 4s ease-in-out infinite;
            transition: transform 0.1s ease-out;
        }
        @keyframes logoPulse { 0%, 100% { filter: drop-shadow(0 0 30px rgba(188, 19, 254, 0.5)); } 50% { filter: drop-shadow(0 0 50px rgba(188, 19, 254, 0.8)); } }
        @keyframes fadeInDown { 0% { opacity: 0; transform: translateY(-30px); } 100% { opacity: 1; transform: translateY(0); } }
        
        .brand-name {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.8rem, 6vw, 3.2rem);
            font-weight: 700; letter-spacing: 0.1em; margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--text-white) 0%, var(--neon-purple-light) 50%, var(--neon-purple) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            animation: fadeInUp 1s ease-out 0.3s both;
        }
        .tagline {
            font-size: clamp(1rem, 3vw, 1.4rem); font-weight: 400;
            letter-spacing: 0.3em; color: var(--text-gray); margin-bottom: 2.5rem;
            animation: fadeInUp 1s ease-out 0.5s both;
        }
        .tagline span { color: var(--neon-purple-light); }
        @keyframes fadeInUp { 0% { opacity: 0; transform: translateY(30px); } 100% { opacity: 1; transform: translateY(0); } }
        
        .loading-container { display: flex; flex-direction: column; align-items: center; gap: 1.5rem; animation: fadeInUp 1s ease-out 0.7s both; }
        .loading-text {
            font-family: 'Orbitron', sans-serif; font-size: 0.9rem;
            letter-spacing: 0.3em; color: var(--neon-purple);
            display: flex; align-items: center; gap: 0.5rem;
        }
        .loading-dots { display: flex; gap: 6px; }
        .loading-dots span {
            width: 8px; height: 8px; background: var(--neon-purple); border-radius: 50%;
            animation: dotPulse 1.5s ease-in-out infinite;
            box-shadow: 0 0 10px var(--neon-purple), 0 0 20px var(--neon-purple);
        }
        .loading-dots span:nth-child(1) { animation-delay: 0s; }
        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dotPulse { 0%, 100% { opacity: 0.3; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } }
        
        .services-preview {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem;
            margin-top: 2rem; max-width: 500px; margin-left: auto; margin-right: auto;
            animation: fadeInUp 1s ease-out 0.9s both;
        }
        .service-tag {
            font-size: 0.85rem; font-weight: 500; letter-spacing: 0.08em;
            padding: 0.7rem 1rem; border: 1px solid rgba(188, 19, 254, 0.3);
            border-radius: 2px; color: var(--text-gray); background: rgba(188, 19, 254, 0.05);
            transition: all 0.3s ease; text-align: center;
        }
        .service-tag:hover { border-color: var(--neon-purple); color: var(--neon-purple-light); background: rgba(188, 19, 254, 0.1); box-shadow: 0 0 20px rgba(188, 19, 254, 0.2); }
        
        .contact-section {
            margin-top: 3rem;
            display: flex; flex-direction: column; align-items: center; gap: 1rem;
            animation: fadeInUp 1s ease-out 1.1s both;
        }
        .email-link {
            font-size: 0.9rem; letter-spacing: 0.1em; color: var(--neon-purple);
            text-decoration: none; transition: all 0.3s ease;
            display: flex; align-items: center; gap: 0.5rem;
        }
        .email-link:hover { color: var(--neon-purple-light); filter: drop-shadow(0 0 8px var(--neon-purple)); }
        .email-link svg { width: 18px; height: 18px; fill: currentColor; }
        
        .social-links { display: flex; gap: 1.5rem; }
        .social-links a {
            color: var(--neon-purple); transition: all 0.3s ease;
            display: flex; align-items: center; justify-content: center;
        }
        .social-links a:hover { color: var(--neon-purple-light); filter: drop-shadow(0 0 10px var(--neon-purple)); transform: scale(1.1); }
        .social-links svg { width: 24px; height: 24px; fill: currentColor; }
        
        .scanline {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, transparent 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px; pointer-events: none; z-index: 100; opacity: 0.03;
        }
        
        @media (max-width: 600px) {
            .logo { max-width: 180px; }
            .tagline { letter-spacing: 0.15em; }
            .services-preview { grid-template-columns: 1fr; gap: 0.8rem; max-width: 280px; }
            .service-tag { font-size: 0.8rem; padding: 0.6rem 0.8rem; }
        }
    </style>
</head>

    <script>
        const logo = document.querySelector('.logo');
        document.addEventListener('mousemove', (e) => {
            const rect = logo.getBoundingClientRect();
            const logoCenterX = rect.left + rect.width / 2;
            const logoCenterY = rect.top + rect.height / 2;
            const deltaX = e.clientX - logoCenterX;
            const deltaY = e.clientY - logoCenterY;
            const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
            const maxDistance = 400;
            let scale = 1.25 - (distance / maxDistance) * 0.25;
            scale = Math.max(1, Math.min(1.25, scale));
            logo.style.transform = `scale(${scale})`;
        });
        document.addEventListener('mouseleave', () => {
            logo.style.transform = 'scale(1)';
        });
    </script>
